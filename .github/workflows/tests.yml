name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest numpy highspy paho-mqtt amqtt bleak bleak-retry-connector aiohttp zeroconf pymodbus voluptuous
      # a pull request skips the slow simulations; they run again before anything lands on main
      - run: python -m pytest tests/ --ignore=tests/simulation --ignore=tests/lag --ignore=tests/compare -q
        if: github.event_name == 'pull_request'
      - run: python -m pytest tests/ --ignore=tests/lag --ignore=tests/compare -q
        if: github.event_name != 'pull_request'
